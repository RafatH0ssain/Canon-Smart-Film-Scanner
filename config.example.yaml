# Canon Smart Film Scan -- example configuration
#
# Copy this file to `config.yaml` and edit it:
#
#     cp config.example.yaml config.yaml        (macOS/Linux)
#     copy config.example.yaml config.yaml      (Windows)
#
# `config.yaml` is git-ignored because it contains your camera's IP address.
# Never commit it.
#
# Every value below can also be overridden by an environment variable named
# CSFS_<SECTION>_<KEY>, uppercased -- e.g. CSFS_CAMERA_BASE_URL. Environment
# variables win over the file. Useful for CI and for temporary experiments.

camera:
  # Base URL of the camera's CCAPI service, with no trailing path.
  #
  # Read this off the camera once CCAPI is connected: the camera's [Wi-Fi on]
  # screen shows the SSID and the top URL of the CCAPI service. Use the host
  # and port from that URL, e.g. "http://192.168.1.42:8080" -- do not include
  # the /ccapi path.
  #
  # Note CCAPI connects over Wi-Fi or wired LAN. USB is used only for the
  # one-time activation, never for control.
  #
  # Leave this pointed at the mock server until you have a real camera set up.
  base_url: "http://127.0.0.1:8080"

  # Only needed if you registered an account on the camera under
  # [Camera Control API] > [Account settings]. CCAPI then requires HTTP digest
  # authentication. Leave both empty for the usual no-account setup.
  username: ""
  password: ""

  # Seconds to wait for a normal control call before giving up.
  timeout_s: 5.0

  # Live view is a long-lived streaming request, so it needs its own, longer
  # read timeout. Too short and a slow-but-healthy stream looks like a failure.
  liveview_timeout_s: 30.0

capture:
  # Seconds to wait after the *last* command that could have disturbed the rig
  # before actually firing the shutter. On a copy stand, residual vibration is
  # the main cause of soft scans; this is the cheapest fix available.
  settle_delay_s: 1.5

  # Prefer the electronic (silent) shutter. This eliminates mechanical shutter
  # shock. If the connected body does not expose the setting, the app logs a
  # warning and continues rather than refusing to work.
  prefer_electronic_shutter: true

  # Where downloaded captures are written. Relative paths resolve against the
  # repository root. This directory is git-ignored.
  output_dir: "captures"

  # Delete the file from the camera's card after a verified download.
  # Default is false: keeping the original on the card is the safer choice.
  delete_from_camera_after_download: false

  # On connect, put two settings into the state scanning needs:
  #   drive mode   -> single   (continuous drive turns one remote release into
  #                             a burst of near-identical frames)
  #   AF operation -> oneshot  (servo AF keeps refocusing, so frames of a roll
  #                             are no longer captured at the same distance)
  # These are written to your camera. Set false if you would rather the app
  # never changed your settings; it will still report them.
  prepare_camera_for_scanning: true

film:
  # Which inversion pipeline the preview uses by default: "bw" or "color".
  # Both are first-class. This is only the startup default; the UI can switch.
  mode: "bw"

server:
  # The local web UI. Bound to loopback by default -- do not expose this to a
  # network you do not trust; it can fire your shutter.
  host: "127.0.0.1"
  port: 8000

mock:
  # The camera-free mock CCAPI server, used for development and tests.
  host: "127.0.0.1"
  port: 8080
