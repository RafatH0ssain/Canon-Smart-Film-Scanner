[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-smart-film-scan"
version = "0.1.0.dev0"
description = "Remote-control film scanning for Canon cameras over CCAPI, with live positive preview."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafat Hossain" }]
keywords = ["film", "scanning", "negative", "canon", "ccapi", "photography"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture",
]

# Kept in sync with requirements.txt. requirements.txt is what a newcomer runs;
# this is what pip needs to install the package itself.
dependencies = [
    "requests>=2.32,<3",
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
csfs-mock = "csfs.mock.mock_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet, readable output by default; add -v when you are debugging one test.
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:csfs.*"]
